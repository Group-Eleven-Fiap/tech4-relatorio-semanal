AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Tech Challenge Fase 4 - Relatorio semanal de feedbacks (EventBridge Scheduler -> Lambda -> DynamoDB -> SES)

Parameters:
  AdminEmail:
    Type: String
    Description: E-mail do administrador, verificado no SES enquanto a conta estiver em sandbox
  EmailRemetente:
    Type: String
    Description: E-mail remetente, verificado no SES
  TabelaAvaliacoes:
    Type: String
    Default: Avaliacoes
    Description: Nome da tabela DynamoDB criada pela ingestao-avaliacao

Resources:
  RelatorioSemanalLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/lambda/relatorio-semanal
      RetentionInDays: 14

  RelatorioSemanalRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: menor-privilegio
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              # Somente leitura: o relatorio nunca altera as avaliacoes
              - Sid: LerAvaliacoes
                Effect: Allow
                Action: dynamodb:Scan
                Resource: !Sub arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${TabelaAvaliacoes}
              # Em sandbox, o SES tambem autoriza contra a identidade do destinatario
              - Sid: EnviarEmail
                Effect: Allow
                Action: ses:SendEmail
                Resource:
                  - !Sub arn:${AWS::Partition}:ses:${AWS::Region}:${AWS::AccountId}:identity/${EmailRemetente}
                  - !Sub arn:${AWS::Partition}:ses:${AWS::Region}:${AWS::AccountId}:identity/${AdminEmail}
              - Sid: EscreverLogs
                Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !GetAtt RelatorioSemanalLogGroup.Arn
              - Sid: EnviarTracesXRay
                Effect: Allow
                Action:
                  - xray:PutTraceSegments
                  - xray:PutTelemetryRecords
                Resource: '*'

  RelatorioSemanalFunction:
    Type: AWS::Serverless::Function
    DependsOn: RelatorioSemanalLogGroup
    Properties:
      FunctionName: relatorio-semanal
      Description: Gera o relatorio semanal das avaliacoes e envia ao administrador por e-mail
      CodeUri: .
      Handler: relatorio_semanal.handler.RelatorioSemanalHandler::handleRequest
      Runtime: java21
      MemorySize: 512
      Timeout: 60
      Role: !GetAtt RelatorioSemanalRole.Arn
      Tracing: Active
      Environment:
        Variables:
          ADMIN_EMAIL: !Ref AdminEmail
          EMAIL_REMETENTE: !Ref EmailRemetente
          TABELA_AVALIACOES: !Ref TabelaAvaliacoes
      Events:
        AgendamentoSemanal:
          Type: ScheduleV2
          Properties:
            Name: relatorio-semanal-agendamento
            Description: Dispara o relatorio toda segunda-feira as 08h, horario de Brasilia
            ScheduleExpression: cron(0 8 ? * MON *)
            ScheduleExpressionTimezone: America/Sao_Paulo
            RetryPolicy:
              MaximumRetryAttempts: 2
              MaximumEventAgeInSeconds: 3600

  TopicoAlarmes:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: relatorio-semanal-alarmes
      Subscription:
        - Protocol: email
          Endpoint: !Ref AdminEmail

  AlarmeErrosLambda:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: relatorio-semanal-erros-lambda
      AlarmDescription: O relatorio semanal nao foi gerado ou nao foi enviado
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref RelatorioSemanalFunction
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref TopicoAlarmes

  # Registros da tabela que nao puderam ser lidos e ficaram fora do relatorio
  FiltroItensIgnorados:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Ref RelatorioSemanalLogGroup
      FilterPattern: '"relatorio.item_ignorado"'
      MetricTransformations:
        - MetricNamespace: TechChallenge/Relatorio
          MetricName: ItensIgnorados
          MetricValue: '1'
          DefaultValue: 0

  AlarmeItensIgnorados:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: relatorio-semanal-itens-ignorados
      AlarmDescription: Avaliacoes com dados invalidos ficaram fora do relatorio
      Namespace: TechChallenge/Relatorio
      MetricName: ItensIgnorados
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref TopicoAlarmes

  DashboardRelatorio:
    Type: AWS::CloudWatch::Dashboard
    Properties:
      DashboardName: relatorio-semanal
      DashboardBody: !Sub |
        {
          "widgets": [
            {
              "type": "metric", "x": 0, "y": 0, "width": 12, "height": 6,
              "properties": {
                "title": "Lambda: invocacoes e erros", "region": "${AWS::Region}", "stat": "Sum", "period": 300,
                "metrics": [
                  ["AWS/Lambda", "Invocations", "FunctionName", "relatorio-semanal"],
                  [".", "Errors", ".", "."],
                  ["TechChallenge/Relatorio", "ItensIgnorados"]
                ]
              }
            },
            {
              "type": "metric", "x": 12, "y": 0, "width": 12, "height": 6,
              "properties": {
                "title": "Lambda: duracao (ms)", "region": "${AWS::Region}", "stat": "Average", "period": 300,
                "metrics": [["AWS/Lambda", "Duration", "FunctionName", "relatorio-semanal"]]
              }
            }
          ]
        }

Outputs:
  FuncaoNome:
    Description: Nome da funcao, para disparo manual com aws lambda invoke
    Value: !Ref RelatorioSemanalFunction
